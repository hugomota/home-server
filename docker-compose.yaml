name: home-server

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Lisbon}

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${CONFIG_ROOT}/traefik/certs:/etc/traefik/certs:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.tls=true
    networks:
      - proxy
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    user: "0:0"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      PUID: "0"
      PGID: "0"
    ports:
      - "3000:3000"
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    networks:
      - proxy
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/portainer:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
      - proxy
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime-kuma.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.uptime-kuma.entrypoints=websecure
      - traefik.http.routers.uptime-kuma.tls=true
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001
    networks:
      - proxy
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8082:80"
    volumes:
      - ${CONFIG_ROOT}/filebrowser:/config
      - ${MEDIA_ROOT}:/srv/media
      - ${DOWNLOADS_ROOT}:/srv/downloads
      - ${PHOTOS_ROOT}:/srv/photos
      - ${DATA_ROOT}:/srv/data
    command:
      - --database
      - /config/filebrowser.db
      - --root
      - /srv
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN}`)
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls=true
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
    networks:
      - proxy
    restart: unless-stopped

  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    environment:
      <<: *common-env
    ports:
      - "5006:5006"
    volumes:
      - ${DATA_ROOT}/actual-budget:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.actual-budget.rule=Host(`budget.${DOMAIN}`)
      - traefik.http.routers.actual-budget.entrypoints=websecure
      - traefik.http.routers.actual-budget.tls=true
      - traefik.http.services.actual-budget.loadbalancer.server.port=5006
    networks:
      - proxy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    environment:
      ENABLE_RAG_WEB_SEARCH: "True"
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_WEB_SEARCH_ENGINE: searxng
      RAG_WEB_SEARCH_RESULT_COUNT: "3"
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
    volumes:
      - ${DATA_ROOT}/open-webui:/app/backend/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-webui.rule=Host(`openwebui.${DOMAIN}`)
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls=true
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
    networks:
      - proxy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    extra_hosts:
      - "registry.ollama.ai:104.21.75.227"
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN}`)
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      - proxy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080
    networks:
      - proxy
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}:/media
      - ${DATA_ROOT}/jellyfin-cache:/cache
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    networks:
      - proxy
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Europe/Lisbon}
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`request.${DOMAIN}`)
      - traefik.http.routers.jellyseerr.entrypoints=websecure
      - traefik.http.routers.jellyseerr.tls=true
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    networks:
      - proxy
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8081
    networks:
      - proxy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    ports:
      - "9696:9696"
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`indexers.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    networks:
      - proxy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.15.2941-ls295
    container_name: sonarr
    environment:
      <<: *common-env
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}/tv:/tv
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      - proxy
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    ports:
      - "7878:7878"
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    networks:
      - proxy
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    ports:
      - "6767:6767"
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/tv:/tv
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`subtitles.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    networks:
      - proxy
    restart: unless-stopped

  emulatorjs:
    image: lscr.io/linuxserver/emulatorjs:1.9.2-ls173
    container_name: emulatorjs
    environment:
      <<: *common-env
      SUBFOLDER: /
    ports:
      - "3003:3000"
      - "8085:80"
      - "4001:4001"
    volumes:
      - ${CONFIG_ROOT}/emulatorjs:/config
      - ${DATA_ROOT}/emulatorjs:/data
      - ${ROMS_LIBRARY_ROOT}:/data/roms
      - ${ROMS_BIOS_ROOT}:/data/bios
    labels:
      - traefik.enable=true
      - traefik.http.routers.emulatorjs.rule=Host(`arcade.${DOMAIN}`)
      - traefik.http.routers.emulatorjs.entrypoints=websecure
      - traefik.http.routers.emulatorjs.tls=true
      - traefik.http.services.emulatorjs.loadbalancer.server.port=80
    networks:
      - proxy
    restart: unless-stopped

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    environment:
      MARIADB_ROOT_PASSWORD: ${ROMM_DB_ROOT_PASSWORD:-change-me}
      MARIADB_DATABASE: ${ROMM_DB_NAME:-romm}
      MARIADB_USER: ${ROMM_DB_USER:-romm}
      MARIADB_PASSWORD: ${ROMM_DB_PASSWORD:-change-me}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${DATA_ROOT}/romm/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - romm
    restart: unless-stopped

  romm:
    image: rommapp/romm:latest
    container_name: romm
    depends_on:
      romm-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY:-change-me}
      DB_HOST: romm-db
      DB_NAME: ${ROMM_DB_NAME:-romm}
      DB_USER: ${ROMM_DB_USER:-romm}
      DB_PASSWD: ${ROMM_DB_PASSWORD:-change-me}
      ROMM_BASE_URL: https://roms.${DOMAIN}
    ports:
      - "8086:8080"
    volumes:
      - ${ROMS_LIBRARY_ROOT}:/romm/library
      - ${DATA_ROOT}/romm/assets:/romm/assets
      - ${DATA_ROOT}/romm/resources:/romm/resources
      - ${CONFIG_ROOT}/romm:/romm/config
      - ${DATA_ROOT}/romm/redis-data:/redis-data
    labels:
      - traefik.docker.network=home-server_proxy
      - traefik.enable=true
      - traefik.http.routers.romm.rule=Host(`roms.${DOMAIN}`)
      - traefik.http.routers.romm.entrypoints=websecure
      - traefik.http.routers.romm.tls=true
      - traefik.http.services.romm.loadbalancer.server.port=8080
    networks:
      - proxy
      - romm
    restart: unless-stopped

  ghostfolio-postgres:
    image: postgres:16-alpine
    container_name: ghostfolio-postgres
    environment:
      POSTGRES_DB: ${GHOSTFOLIO_POSTGRES_DB:-ghostfolio}
      POSTGRES_USER: ${GHOSTFOLIO_POSTGRES_USER:-ghostfolio}
      POSTGRES_PASSWORD: ${GHOSTFOLIO_POSTGRES_PASSWORD:-ghostfolio-pass}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${DATA_ROOT}/ghostfolio/postgres:/var/lib/postgresql/data
    networks:
      - ghostfolio
    restart: unless-stopped

  ghostfolio-redis:
    image: redis:7-alpine
    container_name: ghostfolio-redis
    command: redis-server --save 60 1 --loglevel warning --requirepass ${GHOSTFOLIO_REDIS_PASSWORD:-ghostfolio-redis-pass}
    volumes:
      - ${DATA_ROOT}/ghostfolio/redis:/data
    networks:
      - ghostfolio
    restart: unless-stopped

  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    depends_on:
      - ghostfolio-postgres
      - ghostfolio-redis
    environment:
      ACCESS_TOKEN_SALT: ${GHOSTFOLIO_ACCESS_TOKEN_SALT}
      DATABASE_URL: postgresql://${GHOSTFOLIO_POSTGRES_USER:-ghostfolio}:${GHOSTFOLIO_POSTGRES_PASSWORD:-ghostfolio-pass}@ghostfolio-postgres:5432/${GHOSTFOLIO_POSTGRES_DB:-ghostfolio}?sslmode=prefer
      JWT_SECRET_KEY: ${GHOSTFOLIO_JWT_SECRET_KEY}
      PORT: 3333
      ROOT_URL: ${GHOSTFOLIO_ROOT_URL:-http://localhost:3333}
      POSTGRES_DB: ${GHOSTFOLIO_POSTGRES_DB:-ghostfolio}
      POSTGRES_USER: ${GHOSTFOLIO_POSTGRES_USER:-ghostfolio}
      POSTGRES_PASSWORD: ${GHOSTFOLIO_POSTGRES_PASSWORD:-ghostfolio-pass}
      REDIS_HOST: ghostfolio-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${GHOSTFOLIO_REDIS_PASSWORD:-ghostfolio-redis-pass}
      TZ: ${TZ:-Europe/Lisbon}
    ports:
      - "3333:3333"
    labels:
      - traefik.docker.network=home-server_proxy
      - traefik.enable=true
      - traefik.http.routers.ghostfolio.rule=Host(`investments.${DOMAIN}`)
      - traefik.http.routers.ghostfolio.entrypoints=websecure
      - traefik.http.routers.ghostfolio.tls=true
      - traefik.http.services.ghostfolio.loadbalancer.server.port=3333
    networks:
      - proxy
      - ghostfolio
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-immichpass}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres
    labels:
      - traefik.docker.network=home-server_proxy
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.services.immich.loadbalancer.server.port=2283
    networks:
      - proxy
      - immich
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${DATA_ROOT}/immich/model-cache:/cache
    networks:
      - immich
    restart: unless-stopped

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${DATA_ROOT}/immich/redis:/data
    networks:
      - immich
    restart: unless-stopped

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-immichpass}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    networks:
      - immich
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    ports:
      - "8123:8123"
    volumes:
      - ${CONFIG_ROOT}/homeassistant:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeassistant.rule=Host(`ha.${DOMAIN}`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.tls=true
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
  immich:
    driver: bridge
  romm:
    driver: bridge
  ghostfolio:
    driver: bridge
