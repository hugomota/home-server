name: home-server

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Lisbon}

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${CONFIG_ROOT}/traefik/certs:/etc/traefik/certs:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.tls=true
    networks:
      - proxy
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    user: "0:0"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      PUID: "0"
      PGID: "0"

    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    networks:
      - proxy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: [ai]
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_RAG_WEB_SEARCH: "True"
      OPENAI_API_BASE_URLS: "http://host.docker.internal:8650/v1;http://host.docker.internal:8651/v1;http://host.docker.internal:8652/v1"
      OPENAI_API_KEYS: "${HERMES_DEFAULT_API_KEY};${HERMES_HOME_SERVER_MANAGER_API_KEY};${HERMES_WEBDEV_API_KEY}"
      RAG_WEB_SEARCH_ENGINE: searxng
      RAG_WEB_SEARCH_RESULT_COUNT: "3"
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${DATA_ROOT}/open-webui:/app/backend/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.open-webui.rule=Host(`openwebui.${DOMAIN}`)
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls=true
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
    networks:
      - proxy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: [ai]

    extra_hosts:
      - "registry.ollama.ai:104.21.75.227"
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN}`)
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    networks:
      - proxy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    profiles: [ai]

    volumes:
      - ./searxng:/etc/searxng:rw
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080
    networks:
      - proxy
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    ports:
      - "8096:8096"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/movies:/media/movies
      - ${MEDIA_ROOT}/tv:/media/tv
      - ${DATA_ROOT}/jellyfin-cache:/cache
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    networks:
      - proxy
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    profiles: [media]
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Europe/Lisbon}

    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`request.${DOMAIN}`)
      - traefik.http.routers.jellyseerr.entrypoints=websecure
      - traefik.http.routers.jellyseerr.tls=true
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    networks:
      - proxy
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: [media]
    environment:
      <<: *common-env
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8081
    networks:
      - proxy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    profiles: [media]
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-Europe/Lisbon}
    shm_size: "512mb"
    networks:
      - proxy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    profiles: [media]
    environment:
      <<: *common-env

    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`indexers.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
    networks:
      - proxy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    profiles: [media]
    environment:
      <<: *common-env

    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}/tv:/tv
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    networks:
      - proxy
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    profiles: [media]
    environment:
      <<: *common-env

    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${DOWNLOADS_ROOT}:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    networks:
      - proxy
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    profiles: [media]
    environment:
      <<: *common-env

    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/tv:/tv
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`subtitles.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    networks:
      - proxy
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
    ports:
      - "2283:2283"
    volumes:
      # Originals and transcoded videos on the data disk (HDD).
      - ${UPLOAD_LOCATION}:/data
      # Thumbnails on the SSD so browsing stays fast and the HDD can sleep.
      - ${DATA_ROOT}/immich/thumbs:/data/thumbs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres
    labels:
      - traefik.docker.network=home-server_proxy
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.services.immich.loadbalancer.server.port=2283
    networks:
      - proxy
      - immich
    healthcheck:
      disable: false
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${DATA_ROOT}/immich/model-cache:/cache
    networks:
      - immich
    healthcheck:
      disable: false
    restart: unless-stopped

  # Job queue for Immich; nothing here needs to survive a restart.
  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - immich
    restart: unless-stopped

  # Must match the database image in Immich's official docker-compose.yml.
  # scripts/immich-update.sh skips the weekly update when they differ.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: ${TZ:-Europe/Lisbon}
    shm_size: 128mb
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    networks:
      - immich
    healthcheck:
      disable: false
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
  immich:
    driver: bridge
