- resources:
    cpu: true
    memory: true
    disk:
      - /
      - /mnt/data
    cputemp: true
    tempmin: 30
    tempmax: 100
    uptime: true
    units: metric
    expanded: true
- search:
    provider: duckduckgo
    target: _blank
- datetime:
    text_size: xl
    format:
      dateStyle: full
      timeStyle: short
